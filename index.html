<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Canadian Loonie Coin Toss</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="only light">
<link rel="icon" href="assets/icon.png">
<style>
html{color-scheme:only light}
html,body{margin:0;min-height:100%;background:#fff !important;color:#1b3a5c;font-family:system-ui,"Segoe UI",Roboto,sans-serif;text-align:center}
body{display:flex;align-items:flex-start;justify-content:center;padding:16px;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
.card{margin:auto;width:100%;max-width:380px;box-sizing:border-box;padding:28px 20px 30px;border:6px double #c8102e;border-radius:28px;
 background:#fff;box-shadow:0 10px 30px rgba(27,58,92,.18),inset 0 0 0 4px #fff,inset 0 0 0 6px #e8b400}
h1{margin:0 0 8px;font-family:Montserrat,"Segoe UI",Arial,sans-serif;font-weight:800;font-size:1.7rem;line-height:1.15;letter-spacing:.02em;text-transform:uppercase;color:#0b3d91}
.sub{font-family:Montserrat,"Segoe UI",Arial,sans-serif;font-style:normal;font-weight:500;font-size:1.2rem;letter-spacing:.03em;line-height:1.5rem;color:#000;margin-bottom:6px}
.stage{position:relative;background:#fff;perspective:700px;height:240px;width:100%;overflow:hidden;flex:none}
#coin{position:absolute;left:50%;top:50%;margin:-100px 0 0 -100px;width:200px;height:200px;object-fit:contain;cursor:pointer;mix-blend-mode:multiply}
#coin.spin{animation:s .9s ease-in-out}
@keyframes s{0%{transform:rotateY(0) scale(1)}50%{transform:rotateY(900deg) scale(1.12)}100%{transform:rotateY(1800deg) scale(1)}}
#result{height:3.2rem;line-height:3.2rem;font-size:2.4rem;font-weight:800;margin:6px 0 4px;color:#c8102e;letter-spacing:.04em;white-space:nowrap;overflow:hidden}
button{font-size:1.3rem;padding:.7em 2.6em;border:0;border-radius:2em;background:linear-gradient(#ffd24a,#e8b400);color:#3a2a00;font-weight:800;
 letter-spacing:.08em;text-transform:uppercase;box-shadow:0 5px 0 #a67c00,0 10px 14px rgba(0,0,0,.2);cursor:pointer}
.tap{font-family:Montserrat,"Segoe UI",Arial,sans-serif;font-size:1.2rem;letter-spacing:.03em;line-height:1.5rem;color:#000;margin-bottom:10px}
.ver{margin-top:18px;font-size:.75rem;letter-spacing:.15em;color:#9aa8b8}
button:active{transform:translateY(4px);box-shadow:0 1px 0 #a67c00,0 4px 8px rgba(0,0,0,.2)}
.leaf{display:block;height:54px;width:auto;margin:-8px auto 8px}</style></head><body>
<div class="card">
<img class="leaf" src="assets/maple-leaf.png" alt="">
<h1>Canadian Loonie<br>Coin Toss</h1>
<div class="sub">Call it ... Heads or Tails</div>
<div class="tap">Tap coin to flip</div>
<div class="stage"><img id="coin" src="assets/heads.gif" alt="coin"></div>
<div id="result"></div>
<div class="ver">Version 5<br>By Mark Pieczonka</div>
</div>
<audio id="snd" src="assets/coin-toss-flip.mp3" preload="auto"></audio>
<script>
const coin=document.getElementById('coin'),res=document.getElementById('result'),snd=document.getElementById('snd');
let busy=false;
function flip(){
  if(busy)return;busy=true;res.textContent='';
  try{snd.currentTime=0;snd.play().catch(()=>{});}catch(e){}
  try{navigator.vibrate&&navigator.vibrate(60);}catch(e){}
  const r=new Uint8Array(1);crypto.getRandomValues(r);const heads=(r[0]&1)===0;
  coin.classList.remove('spin');void coin.offsetWidth;coin.classList.add('spin');
  setTimeout(()=>{coin.src=heads?'assets/heads.gif':'assets/tails.gif';res.textContent=heads?'Heads':'Tails';busy=false;},900);
}
coin.onclick=flip;
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
